[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-tracker-api"
version = "1.0.0"
description = "Personal internship and application tracker API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3", "email-validator>=2.2,<3", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.9,<3", "python-multipart>=0.0.9,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "pytest-cov>=7,<8"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
[tool.coverage.report]
show_missing = true
fail_under = 80
