name: internship-tracker-tests
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: tracker_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://tracker:test-only-password@test-db:5432/tracker_test
      TEST_DATABASE_URL: postgresql+asyncpg://tracker:test-only-password@test-db:5432/tracker_test
      JWT_SECRET: test-only-secret-at-least-thirty-two-characters
      APP_ENV: test
    depends_on:
      test-db:
        condition: service_healthy
